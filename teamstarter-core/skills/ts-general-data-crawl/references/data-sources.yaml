# Kinds of business data common to most companies, taken from the catalogue of
# Teamstarter's RPT referential, without the tools where Teamstarter keeps them:
# the map says where the organization keeps them (data_sources). Generated by
# package_rpt_skill.py: do not edit.
format: rpt/v1
data_sources:

  - id: data:pipe-prospects
    name: {en: Pipeline and prospects, fr: Pipe et prospects}
    description:
      en: Targeted prospects, contacts and companies, open deals with their stage, their amount and their next action, sales activity (calls, meetings).
      fr: Prospects, contacts et entreprises ciblés, affaires en cours avec leur étape, leur montant et leur prochaine action, activité commerciale (appels, rendez-vous).
    sensitivity: [personal, internal_confidential]

  - id: data:comptes-clients
    name: {en: Client accounts, fr: Comptes clients}
    description:
      en: Signed clients and the relationship with them, contacts, meeting minutes, cycles sold and their schedule, account health, renewals.
      fr: Clients signés et relation avec eux, contacts, comptes rendus, cycles vendus et leur planning, santé du compte, renouvellements.
    sensitivity: [personal, client]

  - id: data:fichiers-rh
    name: {en: Clients' HR files, fr: Fichiers RH des clients}
    description:
      en: Exports of employee arrivals and departures sent by the clients, and the import or suspension files made from them.
      fr: Exports des entrées et sorties de collaborateurs envoyés par les clients, et fichiers d'import ou de suspension qui en sont tirés.
    sensitivity: [personal, client, hr]

  - id: data:usage-plateforme
    name: {en: Platform usage, fr: Usage de la plateforme}
    description:
      en: Usage statistics and behavior on the platform, KPIs, tracked events, session recordings, client dashboards.
      fr: Statistiques et comportements d'usage de la plateforme, KPIs, événements suivis, enregistrements de sessions, tableaux de bord clients.
    sensitivity: [personal, client]

  - id: data:suivi-brouillons
    name: {en: Draft follow-up, fr: Suivi des brouillons}
    description:
      en: Project drafts of the project holders, their reminder status and deadlines, the Care person assigned and the next action.
      fr: Brouillons de projets des porteurs, leur statut et leurs échéances de relance, le Care attribué et la prochaine action.
    sensitivity: [personal, client]

  - id: data:demandes-utilisateurs
    name: {en: User requests, fr: Demandes des utilisateurs}
    description:
      en: Questions, requests and bugs reported to support by the users of the platform.
      fr: Questions, demandes et bugs signalés par les utilisateurs de la plateforme au support.
    sensitivity: [personal, client]

  - id: data:centre-aide
    name: {en: Help center, fr: Centre d'aide}
    description:
      en: Help articles published for the clients' employees and administrators.
      fr: Articles d'aide publiés pour les collaborateurs et les administrateurs des clients.
    sensitivity: [public]

  - id: data:feedbacks
    name: {en: Client feedback and needs, fr: Feedbacks et besoins clients}
    description:
      en: Feedback from clients and users, qualified and linked to opportunities and tickets.
      fr: Retours des clients et des utilisateurs, qualifiés et reliés aux opportunités et aux tickets.
    sensitivity: [client]

  - id: data:roadmap-produit
    name: {en: Product opportunities and roadmap, fr: Opportunités et roadmap produit}
    description:
      en: Backlog of opportunities, opportunity documents, user research, product roadmap and strategy.
      fr: Backlog des opportunités, documents d'opportunité, recherche utilisateur, roadmap et stratégie produit.
    sensitivity: [internal_confidential]

  - id: data:tickets
    name: {en: Development tickets, fr: Tickets de développement}
    description:
      en: Bugs, features and technical tasks, grouped in projects, with their status, their relations and their comments.
      fr: Bugs, features et tâches techniques, rangés par projet, avec leur statut, leurs relations et leurs commentaires.
    sensitivity: []

  - id: data:code
    name: {en: Code and deliveries, fr: Code et livraisons}
    description:
      en: Source code, pull requests, reviews, CI, published releases.
      fr: Code source, pull requests, revues, CI, versions publiées.
    sensitivity: [internal_confidential]

  - id: data:production
    name: {en: Software platform incidents, fr: Incidents de la plateforme logicielle}
    description:
      en: Errors, incidents, traces and alerts of the platform in production.
      fr: Erreurs, incidents, traces et alertes de la plateforme en production.
    sensitivity: [personal, client]

  - id: data:infrastructure
    name: {en: Infrastructure, fr: Infrastructure}
    description:
      en: Environments, databases, backups, secrets, domains and hosting costs.
      fr: Environnements, bases, sauvegardes, secrets, domaines et coûts d'hébergement.
    sensitivity: [internal_confidential, credentials]

  - id: data:emails
    name: {en: E-mails, fr: E-mails}
    description:
      en: Messages exchanged by e-mail with clients, prospects, partners and the team.
      fr: Messages échangés par e-mail avec les clients, les prospects, les partenaires et l'équipe.
    sensitivity: [personal, client, internal_confidential]

  - id: data:messages-internes
    name: {en: Internal messages, fr: Messages internes}
    description:
      en: The team's channels, threads and direct messages.
      fr: Canaux, fils et messages directs de l'équipe.
    sensitivity: [personal, internal_confidential]

  - id: data:reunions
    name: {en: Meetings and minutes, fr: Réunions et comptes rendus}
    description:
      en: Recordings, transcripts, notes and summaries of the meetings with clients, prospects and the team.
      fr: Enregistrements, transcriptions, notes et résumés des réunions avec les clients, les prospects et l'équipe.
    sensitivity: [personal, client, internal_confidential]

  - id: data:agendas
    name: {en: Calendars and appointments, fr: Agendas et rendez-vous}
    description:
      en: Scheduled meetings, free slots, booked appointments.
      fr: Réunions planifiées, créneaux libres, rendez-vous réservés.
    sensitivity: [personal, client]

  - id: data:ateliers
    name: {en: Workshop boards, fr: Boards d'atelier}
    description:
      en: Boards of the opportunity kick-offs, of the offer workshops and of the continuous improvement workshops.
      fr: Boards des kick-off d'opportunité, des ateliers d'offres et d'amélioration continue.
    sensitivity: [client]

  - id: data:savoir-interne
    name: {en: Internal knowledge, fr: Savoir interne}
    description:
      en: Procedures, referentials, specifications and documents of the company's OS.
      fr: Procédures, référentiels, spécifications et documents de l'OS de l'entreprise.
    sensitivity: []

  - id: data:documents
    name: {en: Working documents, fr: Documents de travail}
    description:
      en: Management's notes, roadmaps and decks, the team's shared documents.
      fr: Notes, roadmaps et supports de la direction, documents partagés de l'équipe.
    sensitivity: [internal_confidential]

  - id: data:offres
    name: {en: Offers and proposals, fr: Offres et propositions}
    description:
      en: Service and training offers, prices, sales decks, proposals and quotes sent, workshop materials.
      fr: Offres de service et de formation, prix, decks commerciaux, propositions et devis envoyés, supports d'atelier.
    sensitivity: [client, internal_confidential]

  - id: data:contenus-marketing
    name: {en: Marketing content, fr: Contenus marketing}
    description:
      en: Articles, website pages, case studies, posts, published newsletters, visuals and videos.
      fr: Articles, pages du site, cas clients, posts, newsletters publiées, visuels et vidéos.
    sensitivity: [public]

  - id: data:campagnes-emailing
    name: {en: E-mail campaigns, fr: Campagnes e-mail}
    description:
      en: Mailing lists, newsletters, sequences and campaigns, with their open and reply statistics.
      fr: Listes d'envoi, newsletters, séquences et campagnes, avec leurs statistiques d'ouverture et de réponse.
    sensitivity: [personal]

  - id: data:webinars
    name: {en: Webinars and events, fr: Webinars et événements}
    description:
      en: Webinars and events, registrations, attendance, replays, trade shows where the company can speak.
      fr: Webinars et événements, inscriptions, présence, replays, salons où prendre la parole.
    sensitivity: [personal]

  - id: data:questionnaires
    name: {en: Questionnaires and surveys, fr: Questionnaires et sondages}
    description:
      en: Questionnaires and surveys sent to clients, users or prospects, and their answers.
      fr: Questionnaires et sondages envoyés aux clients, aux utilisateurs ou aux prospects, et leurs réponses.
    sensitivity: [personal, client]

  - id: data:reporting
    name: {en: Dashboards and reporting, fr: Tableaux de bord et reporting}
    description:
      en: Dashboards, forecasts and reports kept by hand for marketing, sales, the SDRs and the clients.
      fr: Dashboards, forecasts et reportings tenus à la main pour le marketing, les ventes, les SDR et les clients.
    sensitivity: [client, internal_confidential]

  - id: data:depenses
    name: {en: Expenses and receipts, fr: Dépenses et justificatifs}
    description:
      en: Spending of the projects and of the subscriptions, receipts, payments.
      fr: Dépenses des projets et des abonnements, justificatifs, paiements.
    sensitivity: [personal, internal_confidential]

  - id: data:finances
    name: {en: Company finances, fr: Finances de l'entreprise}
    description:
      en: Business plan, P&L, cash tracking, billing forecast, accounting and payments.
      fr: Business plan, P&L, suivi de trésorerie, prévision de facturation, comptabilité et paiements.
    sensitivity: [personal, internal_confidential]

  - id: data:juridique
    name: {en: Contracts and legal matters, fr: Contrats et dossiers juridiques}
    description:
      en: Contracts signed or to be signed, exchanges with the company's legal counsel.
      fr: Contrats signés ou à signer, échanges avec les conseils juridiques de l'entreprise.
    sensitivity: [personal, client, internal_confidential]

  - id: data:veille
    name: {en: Market watch and competition, fr: Veille et concurrence}
    description:
      en: Competitor pages, benchmarks, tool comparisons, watch of the market and of AI.
      fr: Fiches concurrents, benchmarks, comparatifs d'outils, veille du marché et de l'IA.
    sensitivity: []

  - id: data:comptes-equipe
    name: {en: Team accounts and subscriptions, fr: Comptes et abonnements de l'équipe}
    description:
      en: Accounts, rights and licenses of the team members in its tools.
      fr: Comptes, droits et licences des membres de l'équipe dans ses outils.
    sensitivity: [personal]

  - id: data:commandes-clients
    name: {en: Customer orders, fr: Commandes clients}
    description:
      en: 'Orders received from customers or from points of sale: items, quantities, dates.'
      fr: 'Commandes reçues des clients ou des points de vente : articles, quantités, dates.'
    sensitivity: [client]

  - id: data:stock
    name: {en: Stock and inventory, fr: Stock et inventaire}
    description: {en: 'Quantities in stock, inventory counts, losses.', fr: 'Quantités en stock, inventaires, pertes.'}
    sensitivity: []

  - id: data:achats-fournisseurs
    name: {en: Supplier orders, fr: Commandes fournisseurs}
    description:
      en: Orders of materials and supplies to suppliers, deliveries received, supplier prices.
      fr: Commandes de matières et de fournitures aux fournisseurs, livraisons reçues, prix fournisseurs.
    sensitivity: [internal_confidential]

  - id: data:planning-production
    name: {en: Production planning, fr: Planning de production}
    description:
      en: 'What is made when and by whom: batches, shifts, production runs.'
      fr: 'Ce qui est fabriqué, quand et par qui : fournées, équipes, lots de production.'
    sensitivity: []
