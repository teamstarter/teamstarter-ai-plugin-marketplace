# Reference roles and processes: what a role usually covers, whatever the organization.
# Read at step 3 of SKILL.md (point 11): each hat of the map is matched to one or two roles
# below; a process of these roles that no task of the map covers becomes a question at the
# first round of step 4 (three at most). Never a task to add without the person's answer.
#
# Fields
#   roles[].id            `ref:<slug>`, stable: the maps cite it (`roles[].reference.roles`)
#   roles[].department    the id of the main department (references/departments.yaml)
#   roles[].aliases       the job titles that lead to this role, by language
#   roles[].processes     the processes this role usually runs or answers for
#   processes[].id        `refp:<slug>`, stable: the maps cite it (`reference.not_applicable`)
#   processes[].weight    share of the role's time when the process exists: 1 low, 2, 3 high
#   processes[].held_by   the roles that usually do the work (the answer "someone else does it"
#                         names one of them)
#   processes[].key_tasks the tasks that show the process is covered, by language: a task of
#                         the map that does one of them covers the process
#   processes[].signals   tools (names, case ignored) and words that, seen in the sources, make
#                         the process likely in this organization
#   processes[].challenge the question asked when the process is not covered, by language
#
# An id is never renumbered nor reused. A process that no longer fits gets `state: retired`.
# Checked by teamstarter-os/tools/tests/test_build_rpt.py (TestReferenceRoles).
format: rpt-reference/v1
meta: {version: 1, updated: '2026-11-02'}

