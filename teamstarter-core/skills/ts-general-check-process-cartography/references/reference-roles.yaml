processes:
  # Strategy and management
  - id: refp:set-strategy
    department: strategy-management
    name: {en: Set the strategy and yearly objectives, fr: Fixer la stratégie et les objectifs annuels}
    weight: 2
    held_by: [ref:ceo]
    key_tasks:
      en: [write the yearly objectives, run a strategy offsite, decide an investment]
      fr: [écrire les objectifs annuels, animer un séminaire stratégique, arbitrer un investissement]
    signals: {tools: [], words: {en: [okr, objectives, strategy], fr: [okr, objectifs, stratégie, séminaire]}}
    challenge:
      en: How are the yearly objectives set and followed up, and by whom?
      fr: Comment les objectifs de l'année sont-ils fixés et suivis, et par qui ?

  - id: refp:run-leadership
    department: strategy-management
    name: {en: Run the leadership committee, fr: Animer le comité de direction}
    weight: 2
    held_by: [ref:ceo, ref:coo]
    key_tasks:
      en: [prepare the leadership meeting, write the decisions, follow up the actions]
      fr: [préparer le codir, écrire les décisions, suivre les actions]
    signals: {tools: [], words: {en: [leadership committee, board meeting], fr: [codir, comex, comité de direction]}}
    challenge:
      en: Who prepares the leadership meetings and follows up what they decide?
      fr: Qui prépare les réunions de direction et suit ce qu'elles décident ?

  - id: refp:steer-budget
    department: finance-admin
    name: {en: Build and follow the budget, fr: Construire et suivre le budget}
    weight: 2
    held_by: [ref:finance-manager, ref:ceo]
    key_tasks:
      en: [build the yearly budget, compare actuals with the budget, update the cash forecast]
      fr: [construire le budget annuel, comparer le réel au budget, mettre à jour le prévisionnel de trésorerie]
    signals: {tools: [Pennylane, Agicap, Excel], words: {en: [budget, forecast, cash], fr: [budget, prévisionnel, trésorerie]}}
    challenge:
      en: Who builds the budget and checks every month that it is kept?
      fr: Qui construit le budget et vérifie chaque mois qu'il est tenu ?

  - id: refp:report-board
    department: strategy-management
    name: {en: Report to the board and investors, fr: Rendre compte au conseil et aux investisseurs}
    weight: 1
    held_by: [ref:ceo]
    key_tasks:
      en: [write the investor update, prepare the board meeting]
      fr: [écrire le point investisseurs, préparer le conseil d'administration]
    signals: {tools: [], words: {en: [board, investors, reporting], fr: [conseil, actionnaires, investisseurs, board]}}
    challenge:
      en: Who prepares what the board or the shareholders receive?
      fr: Qui prépare ce que reçoivent le conseil ou les actionnaires ?

  # Software development and IT operations
  - id: refp:deliver-code
    department: software-development
    name: {en: Develop and deliver a change of the product, fr: Développer et livrer une évolution du produit}
    weight: 3
    held_by: [ref:developer, ref:tech-lead]
    key_tasks:
      en: [develop a feature, open a pull request, merge a change]
      fr: [développer une fonctionnalité, ouvrir une pull request, intégrer une évolution]
    signals:
      tools: [GitHub, GitLab, Bitbucket, Jira, Linear, Visual Studio Code, Cursor, Claude Code, IntelliJ]
      words: {en: [pull request, merge, sprint, release, commit], fr: [pull request, merge, sprint, mise en production, commit]}
    challenge:
      en: Who writes the code of the product, and how does a change get to production?
      fr: Qui écrit le code du produit, et comment une évolution arrive-t-elle en production ?

  - id: refp:review-code
    department: software-development
    name: {en: Review code, fr: Relire le code}
    weight: 2
    held_by: [ref:tech-lead, ref:developer]
    key_tasks:
      en: [review a pull request, approve a change]
      fr: [relire une pull request, valider une évolution]
    signals: {tools: [GitHub, GitLab, Bitbucket], words: {en: [code review, review], fr: [revue de code, relecture]}}
    challenge:
      en: Who reviews the code before it is merged?
      fr: Qui relit le code avant qu'il soit intégré ?

  - id: refp:fix-bug
    department: software-development
    name: {en: Fix a bug, fr: Corriger un bug}
    weight: 2
    held_by: [ref:developer]
    key_tasks:
      en: [reproduce a bug, fix a bug, write a regression test]
      fr: [reproduire un bug, corriger un bug, écrire un test de non-régression]
    signals: {tools: [Jira, Linear, Sentry, AppSignal, Datadog], words: {en: [bug, hotfix], fr: [bug, anomalie, correctif]}}
    challenge:
      en: When a bug is reported, who fixes it and how long does it take?
      fr: Quand un bug est signalé, qui le corrige et en combien de temps ?

  - id: refp:test-release
    department: software-development
    name: {en: Test a release, fr: Recetter une version}
    weight: 2
    held_by: [ref:qa, ref:developer, ref:product-manager]
    key_tasks:
      en: [run the test plan, test on staging, validate a release]
      fr: [dérouler le plan de test, tester en préproduction, valider une version]
    signals: {tools: [Cypress, Playwright, Selenium, TestRail], words: {en: [staging, qa, test plan], fr: [recette, préprod, plan de test]}}
    challenge:
      en: Who tests a version before it reaches the clients?
      fr: Qui teste une version avant qu'elle arrive chez les clients ?

  - id: refp:plan-tech-roadmap
    department: software-development
    name: {en: Plan the technical work, fr: Planifier le travail technique}
    weight: 1
    held_by: [ref:cto, ref:tech-lead]
    key_tasks:
      en: [estimate the tickets, plan a sprint, decide the architecture]
      fr: [estimer les tickets, planifier un sprint, décider de l'architecture]
    signals: {tools: [Jira, Linear], words: {en: [sprint planning, architecture], fr: [sprint, planning technique, architecture]}}
    challenge:
      en: Who decides what the developers work on next, and in which order?
      fr: Qui décide de ce sur quoi travaillent les développeurs, et dans quel ordre ?

  - id: refp:staff-tech
    department: people-hr
    name: {en: Staff the technical team, fr: Staffer l'équipe technique}
    weight: 1
    held_by: [ref:cto, ref:hr-manager]
    key_tasks:
      en: [run a technical interview, brief a contractor, choose a development agency]
      fr: [faire passer un entretien technique, briefer un prestataire, choisir une agence de développement]
    signals: {tools: [Malt, Welcome to the Jungle, LinkedIn], words: {en: [freelance, contractor, agency], fr: [freelance, prestataire, régie, cabinet]}}
    challenge:
      en: Who are the developers, in house or contractors, and how many are they?
      fr: Qui sont les développeurs, salariés ou prestataires, et combien sont-ils ?

  - id: refp:run-production
    department: it-operations
    name: {en: Keep production running, fr: Faire tourner la production}
    weight: 2
    held_by: [ref:devops, ref:cto]
    key_tasks:
      en: [monitor the platform, scale the infrastructure, back up the data]
      fr: [surveiller la plateforme, dimensionner l'infrastructure, sauvegarder les données]
    signals: {tools: [AWS, Google Cloud, Azure, OVH, Scaleway, Datadog, Grafana], words: {en: [monitoring, uptime, backup], fr: [supervision, disponibilité, sauvegarde]}}
    challenge:
      en: Who watches that the platform is up and acts when it is not?
      fr: Qui surveille que la plateforme fonctionne, et agit quand elle ne fonctionne pas ?

  - id: refp:deploy-release
    department: it-operations
    name: {en: Deploy a release, fr: Déployer une version}
    weight: 1
    held_by: [ref:devops, ref:developer]
    key_tasks:
      en: [deploy to production, roll back a release]
      fr: [déployer en production, revenir à la version précédente]
    signals: {tools: [GitHub Actions, GitLab CI, CircleCI, Jenkins], words: {en: [deploy, ci, pipeline], fr: [déploiement, mise en production, ci]}}
    challenge:
      en: Who deploys a new version, and how often?
      fr: Qui déploie une nouvelle version, et à quelle fréquence ?

  - id: refp:handle-incident
    department: it-operations
    name: {en: Handle a production incident, fr: Traiter un incident de production}
    weight: 2
    held_by: [ref:devops, ref:developer, ref:cto]
    key_tasks:
      en: [diagnose an incident, restore the service, write the post-mortem]
      fr: [diagnostiquer un incident, rétablir le service, écrire le post-mortem]
    signals: {tools: [PagerDuty, Opsgenie, Sentry, AppSignal, Datadog], words: {en: [incident, outage, post-mortem], fr: [incident, panne, post-mortem, astreinte]}}
    challenge:
      en: When the platform breaks, who is called and who repairs it?
      fr: Quand la plateforme tombe, qui est appelé et qui répare ?

  - id: refp:manage-cloud-costs
    department: it-operations
    name: {en: Follow the hosting costs, fr: Suivre les coûts d'hébergement}
    weight: 1
    held_by: [ref:devops, ref:cto]
    key_tasks:
      en: [review the cloud bill, reduce an unused resource]
      fr: [relire la facture cloud, supprimer une ressource inutilisée]
    signals: {tools: [AWS, Google Cloud, Azure], words: {en: [finops, cloud costs], fr: [finops, coûts cloud, facture aws]}}
    challenge:
      en: Who follows the hosting bill and decides what to cut?
      fr: Qui suit la facture d'hébergement et décide de ce qu'on coupe ?

  - id: refp:manage-internal-it
    department: it-operations
    name: {en: Equip and support the employees, fr: Équiper et dépanner les salariés}
    weight: 2
    held_by: [ref:it-manager]
    key_tasks:
      en: [set up a laptop, answer an internal it request, keep the hardware inventory]
      fr: [préparer un ordinateur, répondre à une demande informatique interne, tenir l'inventaire du matériel]
    signals: {tools: [Jamf, Intune, Google Workspace Admin, Microsoft 365 Admin], words: {en: [laptop, wifi, it support], fr: [ordinateur, wifi, support interne, matériel]}}
    challenge:
      en: Who equips the newcomers and repairs a laptop that breaks down?
      fr: Qui équipe les arrivants et dépanne un ordinateur en panne ?

  - id: refp:manage-access
    department: security-compliance
    name: {en: Grant and remove access to tools, fr: Ouvrir et fermer les accès aux outils}
    weight: 1
    held_by: [ref:it-manager, ref:security-officer, ref:cto]
    key_tasks:
      en: [create a user account, remove the access of a leaver, review the access rights]
      fr: [créer un compte utilisateur, fermer les accès d'un partant, revoir les droits d'accès]
    signals: {tools: [Okta, Google Workspace Admin, Microsoft Entra, 1Password, Bitwarden], words: {en: [access, sso, rights], fr: [accès, droits, sso, habilitations]}}
    challenge:
      en: Who opens the accounts of a newcomer and closes those of a leaver?
      fr: Qui ouvre les comptes d'un arrivant et ferme ceux d'un partant ?

  # Product and design
  - id: refp:collect-product-feedback
    department: product-design
    name: {en: Collect and sort product feedback, fr: Recueillir et trier les retours produit}
    weight: 2
    held_by: [ref:product-manager]
    key_tasks:
      en: [log a feature request, sort the feedback, answer a client about a request]
      fr: [enregistrer une demande d'évolution, trier les retours, répondre à un client sur sa demande]
    signals: {tools: [Productboard, Canny, Jira, Linear, Notion], words: {en: [feature request, feedback], fr: [demande d'évolution, retour client, feedback]}}
    challenge:
      en: Where do the clients' requests for the product go, and who sorts them?
      fr: Où vont les demandes d'évolution des clients, et qui les trie ?

  - id: refp:prioritize-roadmap
    department: product-design
    name: {en: Prioritize the product roadmap, fr: Prioriser la roadmap produit}
    weight: 2
    held_by: [ref:product-manager]
    key_tasks:
      en: [update the roadmap, decide the next priorities, present the roadmap]
      fr: [mettre à jour la roadmap, arbitrer les prochaines priorités, présenter la roadmap]
    signals: {tools: [Productboard, Jira, Linear, Notion], words: {en: [roadmap, priorities], fr: [roadmap, priorités, arbitrage]}}
    challenge:
      en: Who decides what the product will do next quarter?
      fr: Qui décide de ce que fera le produit le trimestre prochain ?

  - id: refp:specify-feature
    department: product-design
    name: {en: Specify a feature, fr: Spécifier une fonctionnalité}
    weight: 3
    held_by: [ref:product-manager]
    key_tasks:
      en: [write a user story, write the specification, write the acceptance criteria]
      fr: [écrire une user story, rédiger la spécification, écrire les critères d'acceptation]
    signals: {tools: [Jira, Linear, Notion, Confluence], words: {en: [user story, spec], fr: [user story, spécification, cahier des charges]}}
    challenge:
      en: Who writes what the developers must build, and where?
      fr: Qui écrit ce que les développeurs doivent construire, et où ?

  - id: refp:review-delivery
    department: product-design
    name: {en: Check what was delivered, fr: Vérifier ce qui a été livré}
    weight: 1
    held_by: [ref:product-manager, ref:qa]
    key_tasks:
